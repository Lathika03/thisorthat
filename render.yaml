services:
  - type: web
    name: this-or-that-demo
    runtime: python
    plan: free
    region: ohio
    buildCommand: python -m py_compile server.py
    startCommand: python server.py
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: HOST
        value: 0.0.0.0
      - key: THISORTHAT_DATABASE
        value: /tmp/thisorthat.sqlite3
